<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Próximas Citas del Doctor</title>
</head>
<body>
<h1>Próximas Citas del Doctor</h1>
<table>
    <thead>
    <tr>
        <th>Paciente</th>
        <th>Fecha de Cita</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterar sobre la lista de pacientes con citas futuras -->
    <tr th:each="paciente : ${pacientes}">
        <td th:text="${paciente.nombre}"></td>
        <td th:text="${paciente.fechaCita}"></td>
    </tr>
    </tbody>
</table>
<!-- Enlace para volver a la lista de doctores -->
<a href="/doctores">Volver a la lista de doctores</a>
</body>
</html>
